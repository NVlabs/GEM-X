repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.10
        args: [--line-length, "100"]
        exclude: ^third_party/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^third_party/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^third_party/
      - id: end-of-file-fixer
        exclude: ^third_party/
      - id: check-yaml
        exclude: ^third_party/
      - id: check-added-large-files
        args: [--maxkb=500]
        # Explicit README demo assets are the only size exceptions.
        exclude: ^assets/((demo_2d_keypoints|demo_incam_mesh|demo_global_mesh|hand_pose|body_pose_motion|g1_retarget|gemx_overview)\.gif|(body_pose_motion|body_motion_night|hand_pose|g1_retarget|gemx_overview)\.mp4|(body_pose_motion|body_motion_night|hand_pose|g1_retarget|gemx_overview)_poster\.png)$
