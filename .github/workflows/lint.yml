name: Lint and CPU tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install linters
        run: pip install ruff==0.9.7 black==24.10.0
      - name: Run ruff
        run: ruff check gem scripts tests
      - name: Run black
        run: black --check gem scripts tests

  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[train]' 'pytest>=8' 'setuptools>=61'
      - name: Install video test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run public tests without external model or dataset assets
        run: python -m pytest -q tests
