# Native77 final775 Motion with Body s240000 and original ViTPose observations.
# See MOTION_BENCHMARKS.md for downloads, raw preparation and feature extraction.
device: cuda
pose:
  checkpoint: ${oc.env:GEM_POSE_CHECKPOINT}
  release: body
  batch_size: 4
observations:
  checkpoint: ${oc.env:GEM_VITPOSE_CHECKPOINT}
  release_id: vitpose77-dinov3-huge-metrosim-256x192-v1
  batch_size: 4
motion:
  checkpoint: ${oc.env:GEM_MOTION_CHECKPOINT}
  stats: ${oc.env:GEM_MOTION_STATS}
  network:
    output_dim: 655
    max_len: 120
    cliffcam_dim: 3
    cam_angvel_dim: 6
    imgseq_dim: 1024
    latent_dim: 512
    num_layers: 12
    num_heads: 8
    mlp_ratio: 4.0
    pred_cam_dim: 3
    static_conf_dim: 6
    dropout: 0.1
    avgbeta: true
    obs_num_joints: 77
    sequence_static_slices:
    - - 456
      - 584
    - - 584
      - 640
  condition_spec:
    pose_release_id: gem-pose-body-s240000-v1:pose_tokens
    observation_source: vitpose77-dinov3-huge-metrosim-256x192-v1
    observation_joint_set: soma77_native_v1
  time_options:
    reference_fps: 30.0
    default_fps: 30.0
    fps_by_data_name: {}
evaluation:
  soma_assets: ${oc.env:GEM_SOMA_ASSETS}
  joint_projectors:
    smpl24: ${oc.env:GEM_EVAL_ASSETS}/emdb_projector.pt
    3dpw_j14: ${oc.env:GEM_EVAL_ASSETS}/3dpw_projector.pt
  # Set null for joint-only scoring. PVE/foot sliding also need --include-mesh
  # during target preparation, supplying matching local ground-truth vertices.
  mesh_projector: ${oc.env:GEM_EVAL_ASSETS}/emdb_projector.pt
