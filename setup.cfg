[metadata]
name = gem
version = 0.1.0
description = GEM: Unified body pose, hand pose, and human motion models
long_description = file: README.md
long_description_content_type = text/markdown
license_files =
    LICENSE
    ATTRIBUTIONS.md
    LICENSES/LicenseRef-OpenMDW-1.1.txt

[options]
packages = find:
python_requires = >=3.10
install_requires =
    torch>=2.10,<3
    transformers==5.3.0
    py-soma-x==0.3.3
    numpy>=1.26,<3
    scipy>=1.11,<2
    einops>=0.8,<1
    pillow>=10,<13
    opencv-python-headless>=4.10,<5
    omegaconf>=2.3,<2.4

[options.extras_require]
video =
    onnxruntime>=1.20,<2
hand =
    onnxruntime>=1.20,<2
render =
    open3d==0.19.0
train =
    lightning==2.6.1
    hydra-core>=1.3.2,<1.4
eval =
    lightning==2.6.1
    hydra-core>=1.3.2,<1.4
dev =
    pytest>=8
    ruff>=0.9
    black>=24
    build>=1

[options.entry_points]
console_scripts =
    gem-infer = gem.inference.cli:main
    gem-render = gem.inference.render_cli:main
    gem-train = gem.common.training:main
    gem-eval = gem.pose.evaluation.cli:main

[options.packages.find]
include =
    gem
    gem.common
    gem.common.*
    gem.pose
    gem.pose.*
    gem.motion
    gem.motion.*
    gem.inference
    gem.inference.*
